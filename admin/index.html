<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration · Zenway Saint-Laurent-du-Var</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="admin-body">
  <div class="admin-wrap">
    <div class="admin-header">
      <h1>Administration</h1>
      <div id="dashboardHeader" hidden>
        <span class="who" id="who"></span>
        <button type="button" id="logoutBtn" class="admin-btn-ghost" style="margin-left:12px;padding:6px 14px;border-radius:4px;">Se déconnecter</button>
      </div>
    </div>

    <!-- ============ CONNEXION ============ -->
    <section id="loginView" class="admin-card admin-login">
      <p>Connectez-vous avec un compte Google autorisé pour accéder à l'administration.</p>
      <div id="gsiButton"></div>
      <p class="admin-error" id="loginError" hidden></p>
    </section>

    <!-- ============ TABLEAU DE BORD ============ -->
    <!-- Coquille commune à tous les modules admin (voir assets/js/admin.js) :
         les onglets et le contenu sont générés depuis window.AdminModules,
         alimenté par chaque assets/js/admin-<module>.js. -->
    <section id="dashboardView" hidden>
      <nav class="admin-tabs" id="adminTabs" hidden></nav>
      <div id="adminContent"></div>
    </section>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../assets/js/config-admin.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-events.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>

</html>
