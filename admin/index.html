  <!-- ============ CONNEXION ============ -->
  <section id="loginView" class="ad-gate">
    <div class="ad-gate-card">
      <img class="ad-gate-logo" src="../assets/img/logo/logo-zenway.png" alt="Zenway" width="58" height="42">
      <h1 class="ad-gate-title">Administration</h1>
      <p class="ad-gate-text">Connectez-vous avec un compte Google autorisé pour tenir à jour le site de Saint-Laurent-du-Var.</p>
      <div id="gsiButton" class="ad-gate-gsi"></div>
      <p class="ad-alert" id="loginError" role="alert" hidden></p>
      <p class="ad-gate-foot">
        <svg class="ad-ico" aria-hidden="true"><use href="#i-lock" /></svg>
        Accès réservé aux comptes inscrits sur la liste d'autorisation.
      </p>
    </div>
  </section>

  <!-- ============ CONSOLE ============ -->
  <!-- Une page à la fois. La barre latérale est le menu ; l'adresse porte la
       page courante (#/evenements). Voir assets/js/admin.js. -->
  <div id="appView" class="ad-app" hidden>

    <a class="ad-skip" href="#ad-page">Aller au contenu</a>

    <!-- Voile du menu mobile, hors du <aside> pour rester sous lui -->
    <div class="ad-scrim" id="navScrim" hidden></div>

    <aside class="ad-side" id="adSide">
      <div class="ad-side-head">
        <img src="../assets/img/logo/logo-zenway.png" alt="" width="38" height="28">
        <span class="ad-side-brand">Administration<em>Saint-Laurent-du-Var</em></span>
        <button type="button" class="ad-icon-btn ad-side-close" id="navClose" aria-label="Fermer le menu">
          <svg class="ad-ico" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>

      <nav class="ad-nav" id="adNav" aria-label="Sections de l'administration"></nav>

      <div class="ad-side-foot">
        <a class="ad-side-link" href="../index.html" target="_blank" rel="noopener">
          <svg class="ad-ico" aria-hidden="true"><use href="#i-external" /></svg>
          <span>Voir le site public</span>
        </a>
        <div class="ad-side-user">
          <span class="ad-side-who" id="who"></span>
          <div class="ad-side-tools">
            <button type="button" id="themeBtn" class="ad-icon-btn">
              <svg class="ad-ico" aria-hidden="true"><use href="#i-moon" /></svg>
            </button>
            <button type="button" id="logoutBtn" class="ad-icon-btn" aria-label="Se déconnecter" title="Se déconnecter">
              <svg class="ad-ico" aria-hidden="true"><use href="#i-out" /></svg>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <div class="ad-main">
      <header class="ad-top">
        <button type="button" class="ad-burger" id="navOpen" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="adSide">
          <svg class="ad-ico" aria-hidden="true"><use href="#i-menu" /></svg>
        </button>
        <h1 class="ad-top-title" id="pageTitle">Administration</h1>
        <div class="ad-top-actions" id="pageActions"></div>
      </header>

      <main class="ad-page" id="ad-page" tabindex="-1"></main>
    </div>
