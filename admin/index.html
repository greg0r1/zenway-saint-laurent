<!DOCTYPE html>
<html lang="fr">

<head>

<body class="bo">

  <!--
    THESIS: l'administration est un atelier de feuilles posées sur le bain vert du
    site, jamais un tableau de bord à onglets ; elle refuse le routeur latéral et la
    carte blanche arrondie du panneau d'admin générique.
    OWN-WORLD: bain vert profond en fond ; feuilles de papier à angles vifs, ombre
    longue et douce, posées dessus ; or pour l'action principale et l'état « en
    ligne », teal pour le focus, encre pour le texte. Cormorant aux titres de
    feuille, DM Sans partout ailleurs, aucun Caveat. Icônes tracées à 1,5 px.
    STORY: Béatrice voit d'un coup d'œil tout ce que le site publie, comprend quelle
    feuille commande quelle partie du site, et modifie sur place.
    FIRST VIEWPORT: barre verte fine en haut ; à gauche une réglette-sommaire ; au
    centre la feuille « Événements » ouverte, son état de publication en toutes
    lettres, le formulaire d'ajout au-dessus de la liste.
    FORM: feuilles empilées, candidat 4 de la liste ordonnée, clé 786ddaed.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md
  -->

  <!-- ============ CONNEXION ============ -->
  <section id="loginView" class="bo-gate">
    <div class="bo-gate-card">
      <img class="bo-gate-logo" src="../assets/img/logo/logo-zenway.png" alt="Zenway" width="58" height="42">
      <h1 class="bo-gate-title">Administration</h1>
      <p class="bo-gate-text">Connectez-vous avec un compte Google autorisé pour tenir à jour le site de Saint-Laurent-du-Var.</p>
      <div id="gsiButton" class="bo-gate-gsi"></div>
      <p class="bo-alert" id="loginError" role="alert" hidden></p>
      <p class="bo-gate-foot">
        <svg class="bo-ico" aria-hidden="true"><use href="#i-lock" /></svg>
        Accès réservé aux comptes inscrits sur la liste d'autorisation.
      </p>
    </div>
  </section>

  <!-- ============ ATELIER ============ -->
  <!-- Coquille commune à tous les modules (voir assets/js/admin.js) : chaque
       module déclaré dans window.AdminModules reçoit sa propre feuille, toutes
       montées ensemble sur une seule page. La réglette de gauche est un
       sommaire de la page, pas un routeur. -->
  <div id="dashboardView" class="bo-app" hidden>

    <a class="bo-skip" href="#bo-sheets">Aller au contenu</a>

    <header class="bo-bar">
      <div class="bo-bar-inner">
        <div class="bo-bar-mark">
          <img src="../assets/img/logo/logo-zenway.png" alt="" width="40" height="29">
          <span class="bo-bar-name">Administration<em>Saint-Laurent-du-Var</em></span>
        </div>
        <div class="bo-bar-side">
          <a class="bo-bar-link" href="../index.html" target="_blank" rel="noopener">
            <svg class="bo-ico" aria-hidden="true"><use href="#i-external" /></svg>
            Voir le site
          </a>
          <span class="bo-bar-who" id="who"></span>
          <button type="button" id="logoutBtn" class="bo-btn bo-btn-quiet">
            <svg class="bo-ico" aria-hidden="true"><use href="#i-out" /></svg>
            Se déconnecter
          </button>
        </div>
      </div>
    </header>

    <div class="bo-shell">
      <nav class="bo-rail" id="adminRail" aria-label="Sommaire de l'administration"></nav>
      <main class="bo-sheets" id="bo-sheets" tabindex="-1"></main>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../assets/js/config-admin.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-events.js"></script>
  <!-- source de vérité des créneaux, lue par la feuille « Planning » -->

  <script src="../assets/js/admin-infos.js"></script>

</body>

</html>
