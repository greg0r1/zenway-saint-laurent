<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" fill="none">
  <!-- Volutes dorées du bas de « Nos pratiques & bienfaits » : les longs
       sillages qui balaient le coin gauche de la maquette.

       Ils rasent le bas de la section et ne montent jamais vers les
       colonnes de texte : c'est une nappe, pas un éventail. Trois
       sillages seulement, de longueurs inégales — quatre lignes presque
       parallèles fabriquaient un motif d'ondes, pas un remous.

       Même vocabulaire que la vigne : trait d'or dégradé, fondu à zéro
       aux deux bouts pour qu'aucune ligne ne commence ni ne finisse
       franchement, et lueur obtenue par une passe large et pâle sous la
       passe franche plutôt que par un filtre — que le redimensionnement
       non uniforme de la boîte étirerait de travers. -->
  <defs>
    <linearGradient id="volOr" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0" />
      <stop offset="0.16" stop-color="#c9a86a" stop-opacity="0.68" />
      <stop offset="0.46" stop-color="#d8bb85" stop-opacity="0.78" />
      <stop offset="0.8" stop-color="#c9a86a" stop-opacity="0.38" />
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="volOrCourt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0" />
      <stop offset="0.32" stop-color="#e2c795" stop-opacity="0.72" />
      <stop offset="0.74" stop-color="#d8bb85" stop-opacity="0.5" />
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0" />
    </linearGradient>

    <g id="volSillages">
      <path
        vector-effect="non-scaling-stroke"
        d="M-60,192 C130,186 286,168 430,140 C574,112 730,94 960,86"
      />
      <path
        vector-effect="non-scaling-stroke"
        d="M-60,164 C120,158 262,140 396,112 C530,84 682,64 960,54"
      />
      <path
        vector-effect="non-scaling-stroke"
        d="M-60,132 C96,127 214,110 326,84 C420,62 496,50 612,44"
      />
    </g>

    <!-- La boucle du bord : un remous qui se referme sur lui-même -->
    <g id="volBoucle">
      <path
        vector-effect="non-scaling-stroke"
        d="M104,74 C150,62 182,80 180,110 C178,136 146,148 126,133 C110,121 118,97 144,96"
      />
    </g>
  </defs>

  <g stroke="url(#volOr)" stroke-linecap="round" fill="none">
    <use href="#volSillages" stroke-width="6" opacity="0.07" />
    <use href="#volSillages" stroke-width="1.4" />
  </g>

  <g stroke="url(#volOrCourt)" stroke-linecap="round" fill="none">
    <use href="#volBoucle" stroke-width="5" opacity="0.09" />
    <use href="#volBoucle" stroke-width="1.3" />
  </g>

  <circle cx="180" cy="110" r="2.4" fill="#f0e4c9" opacity=".5" />
  <circle cx="466" cy="98" r="2" fill="#f0e4c9" opacity=".38" />
</svg>
