  <!-- tige basse, rase le bord -->
  <g opacity=".5">
    <path d="M18 440C126 438 236 420 330 386 424 352 494 306 528 258"/>
    <path d="M508 288c26-2 48-18 64-48-30 0-52 18-64 48Z"/>
    <path d="M456 316c-26-20-56-24-88-6 28 24 60 30 88 6Z"/>
