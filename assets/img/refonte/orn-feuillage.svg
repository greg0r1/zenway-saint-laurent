    <path d="M322 146c34-18 56-50 62-94-34 22-56 54-62 94Z"/>
    <path d="M300 196c-42-10-78 2-106 36 40 16 78 4 106-36Z"/>
    <path d="M274 244c32-20 52-54 56-98-32 24-52 58-56 98Z"/>
    <path d="M242 290c-44-8-80 6-108 40 42 16 80 2 108-40Z"/>
    <path d="M204 334c30-22 48-56 50-100-30 26-48 60-50 100Z"/>
    <path d="M158 376c-46-4-82 12-110 46 44 14 84-2 110-46Z"/>
    <path d="M112 412c28-24 44-58 44-102-28 28-44 62-44 102Z"/>
  </g>

  <!-- tige médiane, plus courte, part vers la droite -->
