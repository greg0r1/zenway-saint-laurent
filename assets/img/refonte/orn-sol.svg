<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 260" preserveAspectRatio="none">
  <!-- La coupure entre le hero et la section sombre qui suit. Reprend le
       même langage que le ruban du fond du hero (orn-vague.svg) : deux
       courbes larges et lisses, pas les petits godrons répétés de l'essai
       précédent — le tracé fourni par la maquette, une fois posé sur la
       page, se lisait comme « trop ondulé » à côté du reste du décor,
       beaucoup plus ample. Même famille de mouvement, donc, pour que la
       coupure se sente comme une continuation du ruban plutôt qu'un motif
       à part. -->
  <path
    fill="#c8c5b8"
    d="M-4 168C220 130 452 100 700 116 948 132 1160 176 1444 118V264H-4Z"
  />
</svg>
