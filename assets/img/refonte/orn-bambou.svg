<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 820">
  <!-- Angle haut-droit du hero : les cannes de bambou SEULES, nues. Le
       feuillage est un calque à part (orn-feuillage-droite.svg, posé
       dessous) — c'est bien deux choses dans la maquette, et les réunir
       ici écraserait la profondeur du décor.

       Les quatre cannes sont serrées à la base et s'ouvrent vers le haut,
       comme une touffe qui part d'une même souche.

       Chaque canne est un tracé fléchi monté en quatre passes sur le MÊME
       chemin, ce qui laisse les segments épouser la courbe au lieu d'être
       posés à plat en travers :
         1. un trait sombre un peu plus large — il ne se voit qu'aux
            jointures, où il déborde de part et d'autre : c'est le noeud
            saillant du bambou ;
         2. le corps en pointillé très long — chaque tiret est un
            entre-noeud, chaque intervalle une jointure ;
         3. une nervure claire décalée à gauche, 4. une sombre décalée à
            droite : les deux donnent le galbe du tube.
       Le galbe vient de ces deux nervures et non d'un dégradé horizontal :
       une canne qui dérive de 70 px étalerait le dégradé sur toute sa
       longueur, et l'ombre glisserait du haut vers le bas au lieu de
       cerner le tube.

       Les longueurs de segment et la phase du pointillé diffèrent d'une
       canne à l'autre : des jointures alignées trahiraient le motif. Un
       masque efface le bas (86%-100%) pour que les cannes s'estompent
       juste avant la courbe de la coupure du hero (orn-sol.svg), plutôt
       que de s'arrêter net à mi-hauteur. -->
  <defs>
    <path id="cA" d="M262-20C270 200 288 400 298 600 304 700 304 782 306 840" />
    <path id="cB" d="M356 10C352 220 344 420 336 610 332 700 332 782 332 840" />
    <path id="cC" d="M432 80C424 270 396 450 372 600 360 690 358 782 358 840" />
    <path id="cD" d="M196 40C212 240 250 440 272 620 282 700 280 782 280 840" />

    <linearGradient id="bfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".86" stop-color="#fff" />
      <stop offset="1" stop-color="#000" />
    </linearGradient>
    <mask id="bmask">
      <rect x="0" y="0" width="460" height="820" fill="url(#bfade)" />
    </mask>
  </defs>

  <g mask="url(#bmask)" fill="none">
    <!-- canne d'arrière-plan, la plus fine -->
    <g opacity=".5">
      <use href="#cD" stroke="#7d9050" stroke-width="20" />
      <use href="#cD" stroke="#c4d38e" stroke-width="16" stroke-dasharray="86 7" stroke-dashoffset="-30" />
      <use href="#cD" transform="translate(-4 0)" stroke="#e6eec6" stroke-width="2.4" stroke-dasharray="70 23" stroke-dashoffset="-38" opacity=".7" />
      <use href="#cD" transform="translate(5 0)" stroke="#8ba05c" stroke-width="2.4" stroke-dasharray="70 23" stroke-dashoffset="-38" opacity=".6" />
    </g>

    <g opacity=".72">
      <use href="#cC" stroke="#849656" stroke-width="26" />
      <use href="#cC" stroke="#c0d089" stroke-width="21" stroke-dasharray="98 8" stroke-dashoffset="-12" />
      <use href="#cC" transform="translate(-5 0)" stroke="#eaf2ce" stroke-width="3" stroke-dasharray="80 26" stroke-dashoffset="-21" opacity=".7" />
      <use href="#cC" transform="translate(6 0)" stroke="#87995a" stroke-width="3" stroke-dasharray="80 26" stroke-dashoffset="-21" opacity=".6" />
    </g>

    <use href="#cB" stroke="#77894a" stroke-width="33" />
    <use href="#cB" stroke="#b7c87e" stroke-width="27" stroke-dasharray="112 9" stroke-dashoffset="-56" />
    <use href="#cB" transform="translate(-7 0)" stroke="#ecf3d2" stroke-width="3.6" stroke-dasharray="92 29" stroke-dashoffset="-68" opacity=".65" />
    <use href="#cB" transform="translate(8 0)" stroke="#7e9051" stroke-width="3.6" stroke-dasharray="92 29" stroke-dashoffset="-68" opacity=".55" />

    <!-- canne maîtresse, au premier plan -->
    <use href="#cA" stroke="#6d7f42" stroke-width="41" />
    <use href="#cA" stroke="#b2c377" stroke-width="34" stroke-dasharray="124 10" stroke-dashoffset="-20" />
    <use href="#cA" transform="translate(-9 0)" stroke="#eef5d8" stroke-width="4.4" stroke-dasharray="102 32" stroke-dashoffset="-32" opacity=".62" />
    <use href="#cA" transform="translate(10 0)" stroke="#78894b" stroke-width="4.4" stroke-dasharray="102 32" stroke-dashoffset="-32" opacity=".55" />
  </g>
</svg>
