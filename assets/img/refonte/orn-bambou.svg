<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 820">
  <!-- Angle haut-droit du hero : les cannes de bambou SEULES, nues. Le
       feuillage est un calque à part (orn-feuillage-droite.svg, posé
       dessous) — c'est bien deux choses dans la maquette, et les réunir
       ici écraserait la profondeur du décor.

       Chaque canne est un tracé fléchi (trois verticales parfaites se
       lisaient comme des barreaux) monté en trois passes sur le MÊME
       chemin, ce qui laisse les segments épouser la courbe au lieu d'être
       posés à plat en travers :
         1. un trait sombre un peu plus large — il ne se voit qu'aux
            jointures, où il déborde de part et d'autre : c'est le noeud
            saillant du bambou ;
         2. le trait clair en pointillé très long — chaque tiret est un
            entre-noeud, chaque intervalle une jointure ;
         3. une nervure claire décalée, qui donne le galbe du tube.
       Les longueurs de segment et la phase du pointillé diffèrent d'une
       canne à l'autre : des jointures alignées trahiraient le motif.
       Un masque efface le bas pour rendre le premier plan à la
       silhouette. Décoratif. -->
  <defs>
    <!-- les tracés, réutilisés par les trois passes de chaque canne -->
    <path id="cA" d="M292-20C286 190 274 380 280 560 284 700 272 792 268 840" />
    <path id="cB" d="M352 24C348 210 362 372 354 536 346 676 336 770 330 840" />
    <path id="cC" d="M406 104C402 296 414 448 408 596 400 716 390 788 384 840" />
    <path id="cD" d="M236 62C232 244 244 398 238 548 230 680 220 776 214 840" />

    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="252" y1="0" x2="310" y2="0">
      <stop offset="0" stop-color="#8a9d55" />
      <stop offset=".3" stop-color="#d2de9e" />
      <stop offset=".6" stop-color="#b2c377" />
      <stop offset="1" stop-color="#7a8c4c" />
    </linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="336" y1="0" x2="374" y2="0">
      <stop offset="0" stop-color="#90a35c" />
      <stop offset=".32" stop-color="#d6e2a6" />
      <stop offset=".62" stop-color="#b7c87e" />
      <stop offset="1" stop-color="#7f9151" />
    </linearGradient>
    <linearGradient id="gC" gradientUnits="userSpaceOnUse" x1="394" y1="0" x2="422" y2="0">
      <stop offset="0" stop-color="#9aac68" />
      <stop offset=".34" stop-color="#dde7b3" />
      <stop offset=".64" stop-color="#c0d089" />
      <stop offset="1" stop-color="#8b9d5c" />
    </linearGradient>
    <linearGradient id="gD" gradientUnits="userSpaceOnUse" x1="224" y1="0" x2="250" y2="0">
      <stop offset="0" stop-color="#9db06b" />
      <stop offset=".34" stop-color="#e0e9b8" />
      <stop offset=".64" stop-color="#c4d38e" />
      <stop offset="1" stop-color="#90a260" />
    </linearGradient>

    <linearGradient id="bfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".56" stop-color="#fff" />
      <stop offset="1" stop-color="#000" />
    </linearGradient>
    <mask id="bmask">
      <rect x="0" y="0" width="460" height="820" fill="url(#bfade)" />
    </mask>
  </defs>

  <g mask="url(#bmask)">
    <g fill="none">
      <!-- canne d'arrière-plan, la plus fine -->
      <g opacity=".5">
        <use href="#cD" stroke="#7d9050" stroke-width="20" />
        <use href="#cD" stroke="url(#gD)" stroke-width="16" stroke-dasharray="86 7" stroke-dashoffset="-30" />
        <use href="#cD" stroke="#eef4d5" stroke-width="2.5" stroke-dasharray="70 23" stroke-dashoffset="-38" opacity=".5" />
      </g>

      <g opacity=".72">
        <use href="#cC" stroke="#849656" stroke-width="26" />
        <use href="#cC" stroke="url(#gC)" stroke-width="21" stroke-dasharray="98 8" stroke-dashoffset="-12" />
        <use href="#cC" stroke="#f0f6da" stroke-width="3" stroke-dasharray="80 26" stroke-dashoffset="-21" opacity=".5" />
      </g>

      <use href="#cB" stroke="#77894a" stroke-width="33" />
      <use href="#cB" stroke="url(#gB)" stroke-width="27" stroke-dasharray="112 9" stroke-dashoffset="-56" />
      <use href="#cB" stroke="#f0f6da" stroke-width="3.6" stroke-dasharray="92 29" stroke-dashoffset="-68" opacity=".45" />

      <!-- canne maîtresse, au premier plan -->
      <use href="#cA" stroke="#6d7f42" stroke-width="41" />
      <use href="#cA" stroke="url(#gA)" stroke-width="34" stroke-dasharray="124 10" stroke-dashoffset="-20" />
      <use href="#cA" stroke="#f2f7de" stroke-width="4.4" stroke-dasharray="102 32" stroke-dashoffset="-32" opacity=".45" />
    </g>
  </g>
</svg>
