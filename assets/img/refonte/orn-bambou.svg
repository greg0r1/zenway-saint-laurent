<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 820">
  <!-- Angle haut-droit du hero. Deux couches distinctes, comme dans la
       maquette — et c'est bien deux choses, pas une : des feuilles
       dessinées au trait, larges et posées en arrière-plan, puis devant
       elles des cannes de bambou NUES, sans feuillage accroché. Les
       fondre en un seul bambou feuillu écrase ce qui fait la profondeur
       du décor.

       Les cannes sont des tracés courbes, pas des rectangles : trois
       verticales parfaites se lisaient comme des barreaux. Chacune vient
       d'un chemin légèrement fléchi, et ses noeuds sont le MÊME chemin
       repassé en plus sombre avec un pointillé très espacé — les bandes
       suivent donc la courbe d'elles-mêmes, au lieu d'être posées à plat
       en travers. Un masque efface le bas pour rendre le premier plan à
       la silhouette. Décoratif. -->
  <defs>
    <!-- feuille au trait, pointe vers +x : contour + nervure -->
    <g id="lf" fill="none" stroke="#a9bba1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0Q44-17 104-6Q44 18 0 0Z" />
      <path d="M4 1Q50 3 104-6" />
    </g>

    <!-- les trois tracés, réutilisés pour la canne puis pour ses noeuds -->
    <path id="cA" d="M290-20C284 200 264 380 270 560 274 700 262 790 258 840" />
    <path id="cB" d="M344 30C338 220 356 378 348 540 342 680 350 772 346 840" />
    <path id="cC" d="M398 116C394 300 406 452 400 600 396 720 402 790 399 840" />

    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="248" y1="0" x2="302" y2="0">
      <stop offset="0" stop-color="#47693e" />
      <stop offset=".42" stop-color="#79a466" />
      <stop offset="1" stop-color="#3f5f38" />
    </linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="360" y2="0">
      <stop offset="0" stop-color="#517a46" />
      <stop offset=".45" stop-color="#86ac72" />
      <stop offset="1" stop-color="#476b3e" />
    </linearGradient>
    <linearGradient id="gC" gradientUnits="userSpaceOnUse" x1="390" y1="0" x2="410" y2="0">
      <stop offset="0" stop-color="#5b8450" />
      <stop offset=".45" stop-color="#8fb47b" />
      <stop offset="1" stop-color="#4e7245" />
    </linearGradient>

    <linearGradient id="bfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".56" stop-color="#fff" />
      <stop offset="1" stop-color="#000" />
    </linearGradient>
    <mask id="bmask">
      <rect x="0" y="0" width="460" height="820" fill="url(#bfade)" />
    </mask>
  </defs>

  <g mask="url(#bmask)">
    <!-- ============ couche 1 : le feuillage dessiné, derrière ============ -->
    <g opacity=".85">
      <use href="#lf" transform="translate(150 34) rotate(-20) scale(1.2)" />
      <use href="#lf" transform="translate(196 96) rotate(14) scale(1.05)" />
      <use href="#lf" transform="translate(252 14) rotate(-36) scale(1.15)" />
      <use href="#lf" transform="translate(124 124) rotate(-4) scale(1.3)" />
      <use href="#lf" transform="translate(272 82) rotate(26) scale(.95)" />
    </g>
    <g opacity=".55">
      <use href="#lf" transform="translate(182 188) rotate(-28) scale(1.1)" />
      <use href="#lf" transform="translate(302 138) rotate(-12) scale(1.15)" />
      <use href="#lf" transform="translate(92 58) rotate(30) scale(1)" />
      <use href="#lf" transform="translate(226 248) rotate(18) scale(1.2)" />
      <use href="#lf" transform="translate(330 202) rotate(-32) scale(.9)" />
    </g>

    <!-- ============ couche 2 : les cannes nues, devant ============ -->
    <g fill="none">
      <use href="#cA" stroke="url(#gA)" stroke-width="25" />
      <use href="#cA" stroke="#33512d" stroke-width="25" stroke-dasharray="5 151" opacity=".55" />

      <use href="#cB" stroke="url(#gB)" stroke-width="17" />
      <use href="#cB" stroke="#3a5a33" stroke-width="17" stroke-dasharray="4 146" opacity=".5" />

      <g opacity=".6">
        <use href="#cC" stroke="url(#gC)" stroke-width="12" />
        <use href="#cC" stroke="#3f6038" stroke-width="12" stroke-dasharray="4 142" opacity=".55" />
      </g>
    </g>
  </g>
</svg>
