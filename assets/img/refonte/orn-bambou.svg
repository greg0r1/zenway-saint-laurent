<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 820">
  <!-- Angle haut-droit du hero. Deux couches distinctes, comme dans la
       maquette — et c'est bien deux choses, pas une : des feuilles
       dessinées au trait, larges et posées en arrière-plan, puis devant
       elles des cannes de bambou NUES, sans feuillage accroché. Les
       fondre en un seul bambou feuillu, comme on serait tenté de le
       faire, écrase justement ce qui fait la profondeur du décor.
       Les cannes s'effacent vers le bas (masque) pour laisser le premier
       plan à la silhouette. Décoratif. -->
  <defs>
    <!-- feuille au trait, pointe vers +x : contour + nervure -->
    <g id="lf" fill="none" stroke="#a9bba1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0Q44-17 104-6Q44 18 0 0Z" />
      <path d="M4 1Q50 3 104-6" />
    </g>

    <linearGradient id="bc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c7049" />
      <stop offset=".4" stop-color="#7d9169" />
      <stop offset="1" stop-color="#4f6244" />
    </linearGradient>
    <linearGradient id="bc2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#687c56" />
      <stop offset=".5" stop-color="#8a9c78" />
      <stop offset="1" stop-color="#5a6d4d" />
    </linearGradient>

    <linearGradient id="bfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".56" stop-color="#fff" />
      <stop offset="1" stop-color="#000" />
    </linearGradient>
    <mask id="bmask">
      <rect x="0" y="0" width="460" height="820" fill="url(#bfade)" />
    </mask>
  </defs>

  <g mask="url(#bmask)">
    <!-- ============ couche 1 : le feuillage dessiné, derrière ============ -->
    <g opacity=".85">
      <use href="#lf" transform="translate(96 128) rotate(-24) scale(1.25)" />
      <use href="#lf" transform="translate(120 214) rotate(16) scale(1.05)" />
      <use href="#lf" transform="translate(214 62) rotate(-40) scale(1.15)" />
      <use href="#lf" transform="translate(60 320) rotate(-8) scale(1.35)" />
      <use href="#lf" transform="translate(232 168) rotate(28) scale(.95)" />
    </g>
    <g opacity=".55">
      <use href="#lf" transform="translate(158 396) rotate(-30) scale(1.1)" />
      <use href="#lf" transform="translate(268 268) rotate(-14) scale(1.2)" />
      <use href="#lf" transform="translate(40 60) rotate(34) scale(1)" />
      <use href="#lf" transform="translate(196 470) rotate(20) scale(1.25)" />
      <use href="#lf" transform="translate(300 380) rotate(-36) scale(.9)" />
    </g>

    <!-- ============ couche 2 : les cannes nues, devant ============ -->
    <rect x="268" y="0" width="24" height="820" fill="url(#bc)" />
    <g fill="#43543a" opacity=".8">
      <rect x="266" y="86" width="28" height="6" rx="3" />
      <rect x="266" y="242" width="28" height="6" rx="3" />
      <rect x="266" y="398" width="28" height="6" rx="3" />
      <rect x="266" y="554" width="28" height="6" rx="3" />
    </g>

    <rect x="334" y="38" width="17" height="782" fill="url(#bc2)" />
    <g fill="#4a5c40" opacity=".72">
      <rect x="332" y="132" width="21" height="5" rx="2.5" />
      <rect x="332" y="282" width="21" height="5" rx="2.5" />
      <rect x="332" y="432" width="21" height="5" rx="2.5" />
      <rect x="332" y="582" width="21" height="5" rx="2.5" />
    </g>

    <g opacity=".55">
      <rect x="392" y="122" width="12" height="698" fill="url(#bc2)" />
      <g fill="#4a5c40" opacity=".8">
        <rect x="390" y="196" width="16" height="4" rx="2" />
        <rect x="390" y="346" width="16" height="4" rx="2" />
        <rect x="390" y="496" width="16" height="4" rx="2" />
      </g>
    </g>
  </g>
</svg>
